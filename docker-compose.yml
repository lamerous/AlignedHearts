services:
  db:
    image: postgres
    container_name: database
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - 5432:5432
    env_file:
      - ./database/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend_service:
    build: ./backend
    container_name: aligned_hearts_backend
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/:/app/
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: aligned_hearts_frontend
    ports:
      - "3000:3000"

  nginx:
    image: nginx
    container_name: aligned_hearts_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend_service
      - frontend

  ai_service:
    build: ./core
    container_name: ai_service
    ports:
      - "8001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./core/.env
    volumes:
      - ./core/:/app/

volumes:
  postgres_data:
